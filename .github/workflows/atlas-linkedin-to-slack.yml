name: Atlas LinkedIn to Slack

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: Send the latest visible post as a real test alert
        required: false
        default: false
        type: boolean

concurrency:
  group: atlas-linkedin-to-slack
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch posts and send alerts
        id: bot
        continue-on-error: true
        env:
          SEND_TEST_ALERT: ${{ github.event.inputs.send_test_alert || 'false' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "$SEND_TEST_ALERT" = "true" ]; then
            python linkedin_to_slack.py --test-latest
          else
            python linkedin_to_slack.py
          fi

      - name: Commit delivered activity IDs
        if: always()
        run: |
          if git diff --quiet -- last_seen.txt; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_seen.txt
          git commit -m "chore: update LinkedIn post state"
          git push

      - name: Fail if fetching or alerting failed
        if: always() && steps.bot.outcome == 'failure'
        run: exit 1
